# binding = "DB"
# database_name = "command-center"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
# migrations_dir = "migrations"

# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "command-center-media"

# Secrets (dashboard or `wrangler secret put`):
# - CF_ACCESS_TEAM_DOMAIN
# - CF_ACCESS_AUD
# - DEV_AUTH_BYPASS (local only — never production)
# - DEV_AUTH_EMAIL
