# Cloudflare Worker + static assets (custom domains on workers.dev project)
# Dashboard deploy command must be: npx wrangler deploy
# Build command: exit 0

name = "daneshtabrizi"
compatibility_date = "2025-10-01"

[assets]
directory = "."
not_found_handling = "404-page"

# Bind D1/R2 in the dashboard (or uncomment once real IDs exist).
