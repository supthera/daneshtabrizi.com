<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Publisher HQ — Write</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="/private/assets/private.css?v=pub1" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="kicker">Publisher HQ</span>
        <span class="name">Write Article</span>
      </div>
      <nav class="nav">
        <a href="/private/">Command Center</a>
        <a href="/private/publisher/">Overview</a>
        <a href="/private/publisher/media/">Media</a>
      </nav>
      <div class="user" id="user-slot"></div>
    </header>
    <main>
      <p class="hero-line">Editorial</p>
      <div id="flash"></div>
      <form id="article-form">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" required placeholder="Article title" autocomplete="off" />
        </div>
        <div class="field">
          <label for="slug">Slug</label>
          <input id="slug" name="slug" placeholder="article-slug" autocomplete="off" />
        </div>
        <div class="field">
          <label for="excerpt">Excerpt</label>
          <textarea id="excerpt" name="excerpt" style="min-height:80px" placeholder="Short summary"></textarea>
        </div>
        <div class="field">
          <label>Body</label>
          <div class="editor-shell">
            <div class="editor-toolbar" id="toolbar">
              <button type="button" data-cmd="bold"><b>B</b></button>
              <button type="button" data-cmd="italic"><i>I</i></button>
              <button type="button" data-cmd="insertUnorderedList">List</button>
              <button type="button" data-cmd="formatBlock" data-value="h2">H2</button>
              <button type="button" data-cmd="formatBlock" data-value="blockquote">Quote</button>
              <button type="button" data-cmd="createLink">Link</button>
            </div>
            <div class="editor-surface" id="editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Paste or write your article…"></div>
          </div>
        </div>
        <div class="field">
          <label for="seo_title">SEO title</label>
          <input id="seo_title" name="seo_title" />
        </div>
        <div class="field">
          <label for="seo_description">SEO description</label>
          <textarea id="seo_description" name="seo_description" style="min-height:70px"></textarea>
        </div>
        <section class="panel">
          <h3>Publish destinations</h3>
          <div id="destinations" class="muted">Loading websites…</div>
        </section>
        <div class="row">
          <button class="btn ghost" type="submit" id="save-draft">Save Draft</button>
          <button class="btn" type="button" id="publish-btn">Publish Selected →</button>
          <span class="muted" id="autosave">Autosave idle</span>
        </div>
      </form>
    </main>
  </div>
  <script type="module">
    import { api, el, setActiveNav, requireSession } from "/private/assets/private.js";
    setActiveNav();
    const health = await requireSession();
    document.getElementById("user-slot").textContent = health.identity?.email || "";

    const editor = document.getElementById("editor");
    const form = document.getElementById("article-form");
    const flash = document.getElementById("flash");
    const autosave = document.getElementById("autosave");
    const destinations = document.getElementById("destinations");
    let articleId = null;
    let timer = null;

    document.getElementById("toolbar").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-cmd]");
      if (!btn) return;
      e.preventDefault();
      const cmd = btn.dataset.cmd;
      if (cmd === "createLink") {
        const url = prompt("URL");
        if (url) document.execCommand(cmd, false, url);
        return;
      }
      if (btn.dataset.value) document.execCommand(cmd, false, btn.dataset.value);
      else document.execCommand(cmd, false, null);
      editor.focus();
    });

    function slugify(s) {
      return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    document.getElementById("title").addEventListener("input", (e) => {
      const slug = document.getElementById("slug");
      if (!slug.dataset.touched) slug.value = slugify(e.target.value);
    });
    document.getElementById("slug").addEventListener("input", (e) => {
      e.target.dataset.touched = "1";
    });

    function payload() {
      return {
        title: document.getElementById("title").value.trim() || "Untitled",
        slug: document.getElementById("slug").value.trim() || null,
        excerpt: document.getElementById("excerpt").value.trim() || null,
        content_html: editor.innerHTML,
        seo_title: document.getElementById("seo_title").value.trim() || null,
        seo_description: document.getElementById("seo_description").value.trim() || null,
        status: "draft",
      };
    }

    async function save(manual = false) {
      const body = payload();
      try {
        if (!articleId) {
          const created = await api("/api/articles", { method: "POST", body: JSON.stringify(body) });
          articleId = created.id;
        } else {
          await api("/api/articles/" + articleId, { method: "PATCH", body: JSON.stringify(body) });
        }
        autosave.textContent = `Saved ${new Date().toLocaleTimeString()}`;
        if (manual) {
          flash.replaceChildren(el("div", { class: "flash ok", text: `Draft saved (${articleId}).` }));
        }
        return true;
      } catch (e) {
        autosave.textContent = "Save failed";
        flash.replaceChildren(el("div", { class: "flash err", text: e.message || "Save failed — is D1 bound?" }));
        return false;
      }
    }

    function selectedWebsiteIds() {
      return [...destinations.querySelectorAll('input[type="checkbox"][data-website-id]:checked')]
        .map((box) => box.getAttribute("data-website-id"));
    }

    async function loadWebsites() {
      try {
        const { websites, note } = await api("/api/websites");
        if (!websites?.length) {
          destinations.textContent = note || "No websites yet. Add one under Manage Websites.";
          return;
        }
        destinations.replaceChildren(
          el("div", { class: "dest-list" }, websites.map((w) => {
            const id = "dest-" + w.id;
            const row = el("label", { class: "dest-row", for: id });
            const box = document.createElement("input");
            box.type = "checkbox";
            box.id = id;
            box.dataset.websiteId = w.id;
            if (String(w.domain || "").toLowerCase().includes("medicareagencyfinder")) box.checked = true;
            row.append(
              box,
              el("span", { text: w.name }),
              el("span", { class: "muted", text: w.domain + (w.secret_ref ? "" : " · needs secret_ref") })
            );
            return row;
          }))
        );
      } catch (e) {
        destinations.textContent = e.message;
      }
    }

    document.getElementById("publish-btn").addEventListener("click", async () => {
      const ids = selectedWebsiteIds();
      if (!ids.length) {
        flash.replaceChildren(el("div", { class: "flash err", text: "Select at least one destination." }));
        return;
      }
      const ok = await save(false);
      if (!ok || !articleId) return;
      try {
        const result = await api("/api/articles/" + articleId + "/publish", {
          method: "POST",
          body: JSON.stringify({ website_ids: ids, mode: "publish" }),
        });
        const lines = (result.results || []).map((r) =>
          r.ok
            ? `✓ ${r.website_name}${r.published_url ? " → " + r.published_url : ""}`
            : `✗ ${r.website_name}: ${r.error || "failed"}`
        );
        flash.replaceChildren(el("div", {
          class: "flash " + (result.results?.some((r) => r.ok) ? "ok" : "err"),
          html: `<strong>Publish job ${result.job_id}</strong><br>${lines.join("<br>")}`,
        }));
      } catch (e) {
        flash.replaceChildren(el("div", { class: "flash err", text: e.message || "Publish failed" }));
      }
    });

    function queueAutosave() {
      clearTimeout(timer);
      autosave.textContent = "Autosaving…";
      timer = setTimeout(() => save(false), 1200);
    }
    editor.addEventListener("input", queueAutosave);
    form.addEventListener("input", queueAutosave);
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      save(true);
    });

    await loadWebsites();
  </script>
</body>
</html>
