<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Publisher HQ — Websites</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="/private/assets/private.css?v=pub1" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><span class="kicker">Publisher HQ</span><span class="name">My Websites</span></div>
      <nav class="nav">
        <a href="/private/">Command Center</a>
        <a href="/private/publisher/">Overview</a>
        <a href="/private/publisher/media/">Media</a>
      </nav>
      <div class="user" id="user-slot"></div>
    </header>
    <main>
      <p class="hero-line">Destinations</p>
      <div id="flash"></div>
      <section class="panel">
        <h3>Add website</h3>
        <form id="add-form">
          <div class="field"><label for="name">Name</label><input id="name" required placeholder="MedicareAgencyFinder.com" /></div>
          <div class="field"><label for="domain">Domain</label><input id="domain" required placeholder="medicareagencyfinder.com" /></div>
          <div class="field">
            <label for="connector">Connector</label>
            <select id="connector">
              <option value="custom_rest">Custom REST API</option>
              <option value="wordpress" disabled>WordPress REST API (soon)</option>
              <option value="webflow" disabled>Webflow CMS (soon)</option>
            </select>
          </div>
          <div class="field">
            <label for="endpoint">API endpoint</label>
            <input id="endpoint" placeholder="https://medicareagencyfinder.com/api/publisher/" />
          </div>
          <div class="field">
            <label for="secret_ref">Worker secret name</label>
            <input id="secret_ref" placeholder="MAF_PUBLISHER_TOKEN" />
            <p class="muted" style="margin-top:6px">Create this secret in Cloudflare (Workers → daneshtabrizi → Settings → Variables and Secrets). Do not paste the token here.</p>
          </div>
          <button class="btn" type="submit">Add Website</button>
        </form>
      </section>
      <section class="panel">
        <h3>Connected</h3>
        <div id="list" class="muted">Loading…</div>
      </section>
    </main>
  </div>
  <script type="module">
    import { api, el, setActiveNav, requireSession } from "/private/assets/private.js";
    setActiveNav();
    const health = await requireSession();
    document.getElementById("user-slot").textContent = health.identity?.email || "";
    const list = document.getElementById("list");
    const flash = document.getElementById("flash");

    async function testSite(id, name) {
      try {
        const result = await api("/api/websites/" + id + "/test", { method: "POST", body: "{}" });
        flash.replaceChildren(el("div", {
          class: "flash " + (result.ok ? "ok" : "err"),
          text: (name || id) + ": " + (result.message || (result.ok ? "ok" : "failed")),
        }));
        await refresh();
      } catch (e) {
        flash.replaceChildren(el("div", { class: "flash err", text: e.message }));
      }
    }

    async function refresh() {
      const { websites, note } = await api("/api/websites");
      if (!websites?.length) {
        list.textContent = note || "No websites connected yet.";
        return;
      }
      list.replaceChildren(el("table", { class: "table" }, [
        el("thead", {}, [el("tr", {}, [
          el("th", { text: "Name" }), el("th", { text: "Domain" }),
          el("th", { text: "Endpoint" }), el("th", { text: "Secret" }),
          el("th", { text: "Status" }), el("th", { text: "" }),
        ])]),
        el("tbody", {}, websites.map((w) => {
          const testBtn = document.createElement("button");
          testBtn.type = "button";
          testBtn.className = "btn ghost";
          testBtn.textContent = "Test";
          testBtn.addEventListener("click", () => testSite(w.id, w.name));
          return el("tr", {}, [
            el("td", { text: w.name }),
            el("td", { text: w.domain }),
            el("td", { text: w.api_endpoint || "—" }),
            el("td", { text: w.secret_ref || "—" }),
            el("td", { text: w.connection_status || "unknown" }),
            el("td", {}, [testBtn]),
          ]);
        })),
      ]));
    }

    document.getElementById("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await api("/api/websites", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("name").value,
            domain: document.getElementById("domain").value,
            connector_type: document.getElementById("connector").value,
            api_endpoint: document.getElementById("endpoint").value || null,
            secret_ref: document.getElementById("secret_ref").value || null,
          }),
        });
        flash.replaceChildren(el("div", { class: "flash ok", text: "Website added. Create the Worker secret in Cloudflare, then tap Test." }));
        e.target.reset();
        await refresh();
      } catch (err) {
        flash.replaceChildren(el("div", { class: "flash err", text: err.message }));
      }
    });

    try { await refresh(); }
    catch (e) { list.textContent = e.message; }
  </script>
</body>
</html>
